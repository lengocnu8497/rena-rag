# Run with: DOCKER_HOST=unix:///var/run/docker.sock docker compose up
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app   # hot-reload in dev
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
