name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:

  # ── Python: type-check + eval suite ────────────────────────────────────────
  test:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AWS_REGION: us-east-1
      ENVIRONMENT: ci
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync

      - name: Type check
        run: uv run mypy app/ --ignore-missing-imports

      - name: Eval suite
        run: uv run pytest evals/ -x --tb=short -q

  # ── Dashboard: TypeScript compile + production build ────────────────────────
  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix dashboard

      - name: Build (type-check + bundle)
        run: npm run build --prefix dashboard
