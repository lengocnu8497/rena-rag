name: Deploy

on:
  push:
    branches: [main]

# Prevent concurrent deploys — a new push cancels an in-progress deploy
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:

  # ── Run CI first ────────────────────────────────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Build + push Docker image to ECR ───────────────────────────────────────
  build:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}

    permissions:
      id-token: write   # OIDC token for AWS
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: push
        env:
          ECR_URI: ${{ steps.ecr-login.outputs.registry }}/rena-rag
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_URI:$IMAGE_TAG -t $ECR_URI:latest .
          docker push $ECR_URI:$IMAGE_TAG
          docker push $ECR_URI:latest
          echo "image-uri=$ECR_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ── Deploy FastAPI service to ECS ───────────────────────────────────────────
  deploy-api:
    name: Deploy API (ECS)
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Download the current task definition, strip read-only fields so we can
      # re-register it with the new image without CloudFormation managing it.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rena-rag \
            --query taskDefinition \
            --output json \
          | jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )' > task-definition.json

      - name: Inject new image into task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: rena-rag
          image: ${{ needs.build.outputs.image-uri }}

      - name: Deploy to ECS (rolling update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: rena-rag-service
          cluster: rena-rag-cluster
          wait-for-service-stability: true
          # Roll back if new tasks fail health checks within 10 minutes
          codedeploy-deployment-description: "GitHub SHA ${{ github.sha }}"

  # ── Build + deploy React dashboard to S3 + CloudFront ──────────────────────
  deploy-dashboard:
    name: Deploy dashboard (S3 + CloudFront)
    needs: ci                # dashboard can deploy in parallel with ECS
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install dependencies
        run: npm ci --prefix dashboard

      - name: Build dashboard
        run: npm run build --prefix dashboard
        env:
          # Point the dashboard API client at the live ALB
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Resolve S3 bucket and CloudFront ID from CloudFormation exports
        id: cfn-exports
        run: |
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          BUCKET=$(aws cloudformation list-exports \
            --region "$REGION" \
            --query "Exports[?Name=='rena-rag-DashboardBucket'].Value" \
            --output text)
          DIST_ID=$(aws cloudformation list-exports \
            --region "$REGION" \
            --query "Exports[?Name=='rena-rag-CloudFrontDistributionId'].Value" \
            --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution-id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: |
          aws s3 sync dashboard/dist/ s3://${{ steps.cfn-exports.outputs.bucket }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          # index.html must not be cached — browsers always fetch it fresh
          aws s3 cp dashboard/dist/index.html s3://${{ steps.cfn-exports.outputs.bucket }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn-exports.outputs.distribution-id }} \
            --paths "/*"

  # ── Smoke eval against the live service ────────────────────────────────────
  smoke-eval:
    name: Smoke eval
    needs: deploy-api
    runs-on: ubuntu-latest
    # Non-blocking: a faithfulness dip won't roll back the deploy,
    # but it will show as a warning in the Actions summary.
    continue-on-error: true

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install dependencies
        run: uv sync

      - name: Resolve ALB endpoint from CloudFormation
        id: alb
        run: |
          ALB_DNS=$(aws cloudformation list-exports \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}" \
            --query "Exports[?Name=='rena-rag-AlbDns'].Value" \
            --output text)
          echo "endpoint=http://$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Run smoke eval (fail-below 0.80 faithfulness)
        run: |
          uv run python -m evals.harness \
            --endpoint "${{ steps.alb.outputs.endpoint }}" \
            --golden evals/golden_dataset.json \
            --fail-below 0.80
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ENVIRONMENT: production
          LOG_LEVEL: WARNING
